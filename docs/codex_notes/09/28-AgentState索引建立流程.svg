<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">LaDe AgentState 索引建立与运行流程</title>
  <desc id="desc">展示环境变量触发、Python 检查索引、Neo4j 创建复合 RANGE 索引、等待 ONLINE，以及运行期自动维护和查询使用索引的完整流程。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="titleBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173B68"/>
      <stop offset="1" stop-color="#275D9A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#173B68" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#56708E"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#17845B"/>
    </marker>
    <style>
      .title { font: 700 34px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill: #FFFFFF; }
      .subtitle { font: 400 17px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill: #DCEBFF; }
      .section { font: 700 22px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill: #173B68; }
      .lane { font: 700 17px 'Noto Sans SC','Microsoft YaHei',sans-serif; }
      .box-title { font: 700 18px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill: #172B4D; }
      .box-text { font: 400 15px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill: #344563; }
      .code { font: 500 14px ui-monospace,SFMono-Regular,Consolas,monospace; fill: #25425F; }
      .index-code { font: 500 14px ui-monospace,SFMono-Regular,Consolas,monospace; fill: #FFFFFF; }
      .small { font: 400 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill: #5E6C84; }
      .badge { font: 700 13px 'Noto Sans SC','Microsoft YaHei',sans-serif; fill: #FFFFFF; }
      .arrow { fill: none; stroke: #56708E; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-green { fill: none; stroke: #17845B; stroke-width: 3; marker-end: url(#arrowGreen); }
      .dash { fill: none; stroke: #8CA0B7; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1180" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="112" fill="url(#titleBg)"/>
  <text x="64" y="52" class="title">LaDe AgentState 索引是怎样建立的？</text>
  <text x="64" y="84" class="subtitle">项目负责声明和检查 · Python Driver 负责传输 · Neo4j 负责真正构建、持久化和维护</text>

  <!-- Legend -->
  <g transform="translate(1120,36)">
    <rect x="0" y="0" width="120" height="26" rx="13" fill="#E8F1FF"/>
    <circle cx="16" cy="13" r="6" fill="#3478C9"/>
    <text x="29" y="18" class="small">LaDe / Python</text>
    <rect x="132" y="0" width="108" height="26" rx="13" fill="#F4EDFF"/>
    <circle cx="148" cy="13" r="6" fill="#7A4DB3"/>
    <text x="161" y="18" class="small">Neo4j Driver</text>
    <rect x="252" y="0" width="116" height="26" rx="13" fill="#E9F8F1"/>
    <circle cx="268" cy="13" r="6" fill="#17845B"/>
    <text x="281" y="18" class="small">Neo4j 服务端</text>
  </g>

  <!-- Phase A -->
  <text x="64" y="157" class="section">A. 启动阶段：检查并建立索引（一次性全量填充）</text>

  <!-- Swimlanes -->
  <rect x="48" y="178" width="1504" height="600" rx="20" fill="#FFFFFF" stroke="#D8E2EF" filter="url(#shadow)"/>
  <rect x="48" y="178" width="180" height="600" rx="20" fill="#F5F8FC"/>
  <line x1="228" y1="178" x2="228" y2="778" stroke="#D8E2EF" stroke-width="2"/>
  <line x1="48" y1="378" x2="1552" y2="378" stroke="#D8E2EF" stroke-width="2"/>
  <line x1="48" y1="518" x2="1552" y2="518" stroke="#D8E2EF" stroke-width="2"/>

  <text x="78" y="278" class="lane" fill="#3478C9">LaDe 项目代码</text>
  <text x="78" y="449" class="lane" fill="#7A4DB3">Python Driver</text>
  <text x="78" y="653" class="lane" fill="#17845B">Neo4j 服务端</text>

  <!-- Project boxes -->
  <g filter="url(#shadow)">
    <rect x="270" y="218" width="250" height="116" rx="14" fill="#EDF5FF" stroke="#77A9E3" stroke-width="2"/>
    <rect x="558" y="218" width="280" height="116" rx="14" fill="#EDF5FF" stroke="#77A9E3" stroke-width="2"/>
    <rect x="878" y="218" width="284" height="116" rx="14" fill="#EDF5FF" stroke="#77A9E3" stroke-width="2"/>
    <rect x="1202" y="218" width="300" height="116" rx="14" fill="#EDF5FF" stroke="#77A9E3" stroke-width="2"/>
  </g>

  <circle cx="296" cy="242" r="15" fill="#3478C9"/><text x="291" y="248" class="badge">1</text>
  <text x="318" y="248" class="box-title">环境变量触发</text>
  <text x="294" y="278" class="code">KG_RECORD_AGENT_STATE=1</text>
  <text x="294" y="303" class="code">KG_AUTO_CREATE_INDEXES=1</text>
  <text x="294" y="324" class="small">否则跳过自动建索引</text>

  <circle cx="584" cy="242" r="15" fill="#3478C9"/><text x="579" y="248" class="badge">2</text>
  <text x="606" y="248" class="box-title">构造知识库</text>
  <text x="582" y="279" class="code">Neo4jKnowledgeStore(...)</text>
  <text x="582" y="305" class="box-text">创建 Driver，并调用</text>
  <text x="582" y="327" class="code">ensure_agent_state_indexes()</text>

  <circle cx="904" cy="242" r="15" fill="#3478C9"/><text x="899" y="248" class="badge">3</text>
  <text x="926" y="248" class="box-title">读取现有 schema</text>
  <text x="902" y="280" class="code">SHOW INDEXES</text>
  <text x="902" y="305" class="box-text">比较类型、标签、属性及顺序</text>
  <text x="902" y="327" class="small">不只按索引名称判断</text>

  <circle cx="1228" cy="242" r="15" fill="#3478C9"/><text x="1223" y="248" class="badge">4</text>
  <text x="1250" y="248" class="box-title">逐组处理定义</text>
  <text x="1226" y="277" class="box-text">等价索引 → 直接复用</text>
  <text x="1226" y="301" class="box-text">名称冲突 → 报错终止</text>
  <text x="1226" y="325" class="box-text">确实缺失 → 发送 CREATE</text>

  <path d="M520 276 H558" class="arrow"/>
  <path d="M838 276 H878" class="arrow"/>
  <path d="M1162 276 H1202" class="arrow"/>

  <!-- Driver lane -->
  <rect x="615" y="407" width="550" height="82" rx="14" fill="#F6F0FF" stroke="#A88ACE" stroke-width="2" filter="url(#shadow)"/>
  <text x="645" y="437" class="box-title">neo4j Python Driver 6.2.0</text>
  <text x="645" y="466" class="box-text">连接池 + 参数编码 + Bolt 协议传输；它不在 Python 内存里构建索引树</text>
  <path d="M698 334 V407" class="arrow"/>
  <path d="M1350 334 V368 H1080 V407" class="arrow"/>

  <!-- Neo4j lane -->
  <g filter="url(#shadow)">
    <rect x="270" y="554" width="285" height="180" rx="14" fill="#EDFAF4" stroke="#65B895" stroke-width="2"/>
    <rect x="590" y="554" width="285" height="180" rx="14" fill="#EDFAF4" stroke="#65B895" stroke-width="2"/>
    <rect x="910" y="554" width="285" height="180" rx="14" fill="#EDFAF4" stroke="#65B895" stroke-width="2"/>
    <rect x="1230" y="554" width="272" height="180" rx="14" fill="#EDFAF4" stroke="#65B895" stroke-width="2"/>
  </g>

  <circle cx="296" cy="580" r="15" fill="#17845B"/><text x="291" y="586" class="badge">5</text>
  <text x="318" y="586" class="box-title">创建 RANGE 索引</text>
  <text x="294" y="617" class="code">CREATE INDEX ...</text>
  <text x="294" y="641" class="code">FOR (a:AgentState)</text>
  <text x="294" y="665" class="code">ON (a.run_id, ...)</text>
  <text x="294" y="702" class="small">省略 RANGE 时为默认类型</text>

  <circle cx="616" cy="580" r="15" fill="#17845B"/><text x="611" y="586" class="badge">6</text>
  <text x="638" y="586" class="box-title">填充已有数据</text>
  <text x="614" y="618" class="box-text">扫描已有 AgentState</text>
  <text x="614" y="643" class="box-text">读取并编码复合属性键</text>
  <text x="614" y="668" class="box-text">批量写入 B+Tree / GB+Tree</text>
  <rect x="614" y="690" width="118" height="25" rx="12" fill="#E8A23A"/>
  <text x="630" y="708" class="badge">POPULATING</text>

  <circle cx="936" cy="580" r="15" fill="#17845B"/><text x="931" y="586" class="badge">7</text>
  <text x="958" y="586" class="box-title">轮询状态</text>
  <text x="934" y="618" class="code">SHOW INDEXES</text>
  <text x="934" y="645" class="box-text">FAILED → 抛出失败原因</text>
  <text x="934" y="670" class="box-text">超时 → TimeoutError</text>
  <text x="934" y="701" class="small">默认最长等待 600 秒</text>

  <circle cx="1256" cy="580" r="15" fill="#17845B"/><text x="1251" y="586" class="badge">8</text>
  <text x="1278" y="586" class="box-title">索引可用</text>
  <rect x="1254" y="611" width="96" height="28" rx="14" fill="#17845B"/>
  <text x="1273" y="631" class="badge">ONLINE</text>
  <text x="1254" y="667" class="box-text">仿真启动继续执行</text>
  <text x="1254" y="692" class="box-text">规划器可以选择索引</text>
  <text x="1254" y="716" class="small">无需为每个 step 重建</text>

  <path d="M555 644 H590" class="arrow-green"/>
  <path d="M875 644 H910" class="arrow-green"/>
  <path d="M1195 644 H1230" class="arrow-green"/>
  <path d="M890 489 V526 H412 V554" class="arrow-green"/>

  <!-- Three index definitions -->
  <rect x="285" y="750" width="1210" height="54" rx="12" fill="#173B68"/>
  <text x="310" y="783" class="badge">最终得到 3 个复合索引：</text>
  <text x="490" y="783" class="index-code">(run_id, drone_id, step_index)</text>
  <text x="803" y="783" class="index-code">(run_id, region_id, step_index)</text>
  <text x="1138" y="783" class="index-code">(run_id, step_index)</text>

  <!-- Phase B -->
  <text x="64" y="855" class="section">B. 运行阶段：索引由 Neo4j 自动增量维护并用于查询</text>
  <rect x="48" y="876" width="1504" height="236" rx="20" fill="#FFFFFF" stroke="#D8E2EF" filter="url(#shadow)"/>

  <g filter="url(#shadow)">
    <rect x="92" y="923" width="305" height="136" rx="15" fill="#EDF5FF" stroke="#77A9E3" stroke-width="2"/>
    <rect x="472" y="923" width="305" height="136" rx="15" fill="#EDFAF4" stroke="#65B895" stroke-width="2"/>
    <rect x="852" y="923" width="305" height="136" rx="15" fill="#EDFAF4" stroke="#65B895" stroke-width="2"/>
    <rect x="1232" y="923" width="270" height="136" rx="15" fill="#FFF6E8" stroke="#E8A23A" stroke-width="2"/>
  </g>

  <text x="118" y="955" class="box-title">每个 step 批量写状态</text>
  <text x="118" y="985" class="code">UNWIND $agent_states</text>
  <text x="118" y="1010" class="code">MERGE (a:AgentState {</text>
  <text x="118" y="1032" class="code"> run_id, drone_id, step_index })</text>

  <text x="498" y="955" class="box-title">事务内自动维护索引</text>
  <text x="498" y="986" class="box-text">新增/修改节点属性时</text>
  <text x="498" y="1011" class="box-text">Neo4j 同步增删对应索引项</text>
  <text x="498" y="1036" class="small">无需应用代码手动更新树结构</text>

  <text x="878" y="955" class="box-title">查询规划器自动选择</text>
  <text x="878" y="986" class="box-text">依据谓词、字段顺序与统计</text>
  <text x="878" y="1012" class="code">NodeIndexSeek</text>
  <text x="878" y="1036" class="small">业务 Cypher 通常不用指定索引名</text>

  <text x="1258" y="955" class="box-title">效果</text>
  <text x="1258" y="986" class="box-text">从“扫描大量节点”</text>
  <text x="1258" y="1012" class="box-text">变为“定位连续键区间”</text>
  <text x="1258" y="1038" class="small">换取额外磁盘与写入成本</text>

  <path d="M397 991 H472" class="arrow-green"/>
  <path d="M777 991 H852" class="arrow-green"/>
  <path d="M1157 991 H1232" class="arrow-green"/>

  <!-- Footer -->
  <rect x="48" y="1133" width="1504" height="30" rx="15" fill="#E8EEF6"/>
  <text x="70" y="1154" class="small">关键边界：这是普通非唯一 RANGE 索引，只负责加速；若要从 schema 层禁止重复键，需要另建复合唯一约束。</text>
</svg>
