<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">项目运行逻辑简化图</title>
  <desc id="desc">Ray 分担写入模式。网页提交参数并查看结果，主进程统一派单、推进时间、汇总；各无人机并行执行，写本机事件和状态；专用写入进程写全局记录；Neo4j 保存数据。在 KG_STATE_SOURCE=neo4j 时，主进程从 Neo4j 读取调度状态，以绿色箭头标出。每个时间步都能重新派单，不需要等配送完成。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#52657b"/></marker>
    <marker id="readArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#16806b"/></marker>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #1d324b; }
      .title { font-size: 32px; font-weight: 700; }
      .heading { font-size: 26px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 18px; fill: #52657b; }
      .label { font-size: 18px; fill: #41566d; }
      .flow { fill: none; stroke: #52657b; stroke-width: 2.5; marker-end: url(#arrow); }
      .readflow { fill: none; stroke: #16806b; stroke-width: 3; marker-end: url(#readArrow); }
      .readlabel { font-size: 17px; fill: #16806b; }
    </style>
  </defs>
  <rect width="1200" height="880" fill="#ffffff"/>
  <text x="60" y="54" class="title">项目运行逻辑 · 简化版</text>
  <text x="60" y="88" class="small">Ray 分担写入（KG_WRITE_MODE=ray）；Neo4j 状态读取按配置启用</text>

  <rect x="60" y="125" width="1080" height="90" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="85" y="162" class="heading">网页</text>
  <text x="85" y="194" class="body">设置仿真参数，查看地图、任务进度与事件</text>

  <rect x="60" y="300" width="440" height="230" rx="16" fill="#eff6ff" stroke="#83afe9" stroke-width="2"/>
  <text x="85" y="344" class="heading">主进程</text>
  <text x="85" y="390" class="body">读取状态，检查新到期任务</text>
  <text x="85" y="431" class="body">派单，通知各机推进一个时间步</text>
  <text x="85" y="472" class="body">等本步返回，汇总并推送页面</text>

  <rect x="700" y="300" width="440" height="230" rx="16" fill="#ecfdf5" stroke="#6bbfa3" stroke-width="2"/>
  <text x="725" y="344" class="heading">无人机进程（N 个）</text>
  <text x="725" y="390" class="body">维护位置、电量和任务队列</text>
  <text x="725" y="431" class="body">执行配送，产生并写入本机事件</text>
  <text x="725" y="472" class="body">配送途中也可接收新任务</text>

  <rect x="60" y="630" width="440" height="130" rx="16" fill="#fff7ed" stroke="#e8ac64" stroke-width="2"/>
  <text x="85" y="677" class="heading">全局记录写入进程（1 个）</text>
  <text x="85" y="721" class="body">保存全局统计、跨机协助等记录</text>

  <rect x="700" y="630" width="440" height="130" rx="16" fill="#f0fdfa" stroke="#70bdb0" stroke-width="2"/>
  <text x="725" y="677" class="heading">Neo4j 知识图谱</text>
  <text x="725" y="721" class="body">保存任务、无人机、事件和状态</text>

  <path d="M190 215 V300" class="flow"/>
  <text x="95" y="264" class="label">启动参数</text>
  <path d="M390 300 V215" class="flow"/>
  <text x="408" y="264" class="label">页面更新</text>

  <path d="M500 390 H700" class="flow"/>
  <text x="526" y="375" class="label">派单 / 推进一步</text>
  <path d="M700 470 H500" class="flow"/>
  <text x="526" y="455" class="label">本步结果 / 回执</text>

  <path d="M280 530 V630" class="flow"/>
  <text x="300" y="588" class="label">全局记录</text>
  <path d="M920 530 V630" class="flow"/>
  <text x="940" y="588" class="label">本机事件与状态</text>
  <path d="M500 705 H700" class="flow"/>
  <text x="582" y="689" class="label">保存</text>

  <path d="M750 630 V570 H420 V530" class="readflow"/>
  <text x="447" y="556" class="readlabel">读取调度状态（KG_STATE_SOURCE=neo4j）</text>

  <text x="60" y="813" class="body">每步循环：派单 → 各无人机并行推进一小段仿真时间 → 汇总 → 下一步</text>
  <text x="60" y="850" class="body" font-weight="700">一个时间步 ≠ 一个订单；每步可追加派单，无需等当前配送结束。</text>
</svg>
