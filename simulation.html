<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>吉林多 Drone 派送仿真</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app sim-app">
      <aside class="sidebar">
        <div class="brand">
          <img src="./assets/LaDe.png" alt="LaDe" />
          <div>
            <h1>Drone Delivery</h1>
            <p>Jilin multi-agent demo</p>
          </div>
        </div>

        <section class="control-panel" aria-label="仿真控制">
          <label>
            Trace 文件
            <select id="traceSelect"></select>
          </label>
          <button id="playPause" class="primary-action" type="button">播放</button>
          <button id="reset" type="button">重置</button>
          <label>
            播放速度
            <select id="speed">
              <option value="220">慢速</option>
              <option value="90" selected>正常</option>
              <option value="35">快速</option>
            </select>
          </label>
        </section>

        <section class="meta">
          <span>框架</span>
          <strong>rule-based agents + auction coordinator</strong>
        </section>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <h2>吉林派送多 Agent 仿真</h2>
            <p>5 个飞行机器人从中心 depot 出发，通过拍卖式协作分配完成 120 个派送任务。</p>
          </div>
          <div class="topbar-actions">
            <a class="text-link" href="./dynamic.html">动态仿真</a>
            <a class="text-link" href="./index.html">数据概览</a>
          </div>
        </header>

        <section class="kpis" aria-label="仿真指标">
          <article>
            <span>完成任务</span>
            <strong id="completedTasks">-</strong>
          </article>
          <article>
            <span>Drone</span>
            <strong id="droneCount">-</strong>
          </article>
          <article>
            <span>迟到任务</span>
            <strong id="lateTasks">-</strong>
          </article>
          <article>
            <span>当前时间</span>
            <strong id="simTime">-</strong>
          </article>
        </section>

        <section class="panel sim-panel">
          <div class="panel-head">
            <h3>派送轨迹</h3>
            <div class="panel-tools">
              <button id="zoomOut" type="button" aria-label="缩小地图">-</button>
              <span id="zoomLabel">100%</span>
              <button id="zoomIn" type="button" aria-label="放大地图">+</button>
              <button id="zoomReset" type="button">100%</button>
              <span id="frameCaption">-</span>
            </div>
          </div>
          <canvas id="simCanvas" width="1200" height="720"></canvas>
        </section>

        <section class="panel table-panel">
          <div class="panel-head">
            <h3>Agent 状态</h3>
            <span id="agentCaption">-</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Agent</th>
                  <th>状态</th>
                  <th>Region</th>
                  <th>队列</th>
                  <th>完成</th>
                  <th>飞行距离</th>
                </tr>
              </thead>
              <tbody id="agentTable"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="./src/simulation_app.mjs"></script>
  </body>
</html>
